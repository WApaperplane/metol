<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  NXUI 专用 fontconfig 配置（2026-10-19）

  ⚠ 这里刻意只列一个 <dir>。fontconfig 扫描一个目录时会为目录里**每个**字体
  文件建 pattern：只要原厂那份 10.7 MB 的 SDIC_GP_US 还挂在搜索路径上，每次
  开面板都要为它的 cmap 扫描白付 147 ms。实测（bench_font_dirs.sh）：
     只有 mod 字体目录        52 ms
     mod 目录 + /usr/share/fonts  235 ms
  所以系统字体目录一律不列。本文件只被 nxui.sh export 给 nxui 进程，
  不影响相机上其它程序。

  缺字回退不靠 family 名（family 已经不在搜索路径里了），而是 nxui.c 用
  FC_FILE 直接打开 /usr/share/fonts/SDIC_GP_US_20120720.ttf，约 370 ms，
  只在 look 名或菜单项含 GB2312 以外字符时触发。路径可用 NXUI_FONT_FILE 覆盖。

  字体文件：nxui/fonts/NXUI_CJK.ttf（GB2312 子集，1.9 MB，family NXUI_CJK），
  由 test_server/nxui/make_font_subset.py 生成。子集保留下来的字符与原厂
  字体渲染逐字节一致（PPM md5 相同），打开成本从 147 ms 降到 53 ms（冷缓存；
  机上 fc-cache 写不出来，所以按冷值算，见 docs/current/NXUI_FIRST_FRAME_2026-10-19.md）。

  不要再裁小：38 KB 面板子集按文件打开实测 49 ms，与这份 1.9 MB 的 51 ms
  相同 —— FcFreeTypeQuery 的固定开销与码点数几乎无关。而面板里 68 个配方名
  有 21 个是中文，裁到 ASCII 必然触发回退，反而更慢。

  cachedir 指到 SD 卡只是为了给一个可写位置：实测 fontconfig 在这条路径上
  从未成功写出缓存（bench_font_cache.sh 三种字体都是 cachefiles=0），
  不要指望缓存提速。
-->
<fontconfig>
  <dir>/opt/usr/nx-ks/nxui/fonts</dir>
  <cachedir>/mnt/mmc/nxui/fc-cache</cachedir>
</fontconfig>
